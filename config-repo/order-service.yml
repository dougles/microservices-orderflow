server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/orders
    username: orders
    password: ${ORDERS_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      # Por defecto 5 s: haria que cada intento supere los 2 s de SPEC 12.
      validation-timeout: 1000
      data-source-properties:
        # Segundos. Sin esto, una base congelada cuelga la consulta sin limite y no hay reintentos.
        socketTimeout: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/messaging
  kafka:
    bootstrap-servers: kafka:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      client:
        registration:
          catalog:
            provider: keycloak
            client-id: order-service
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://keycloak:8180/realms/orderflow/protocol/openid-connect/token
  cloud:
    loadbalancer:
      # Sin retry hacia catalog (SPEC §12): por defecto reintenta en otra instancia.
      retry:
        enabled: false
    circuitbreaker:
      resilience4j:
        # Sin time limiter: los timeouts son los del cliente HTTP (SPEC §12) y la llamada corre en
        # el hilo del request (sin thread pool: conserva el contexto de seguridad y de traza).
        disable-time-limiter: true
        disable-thread-pool: true
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      sqs:
        endpoint: http://localstack:4566
