spring:
  flyway:
    locations: classpath:db/migration,classpath:db/messaging,classpath:db/seed

orderflow:
  outbox:
    poll-interval: PT0.2S
    batch-size: 100
    retention: P7D
  inbox:
    retention: P7D
  saga:
    step-timeout: PT5M
    compensation-retry-interval: PT1M
    max-compensation-attempts: 5
    timeout-check-interval: PT1S
  idempotency:
    retention: PT24H
  dlq-monitor:
    interval: PT30S
