server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/inventory
    username: inventory
    password: ${INVENTORY_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
      # Por defecto 5 s: haria que cada intento supere los 2 s de SPEC 12.
      validation-timeout: 1000
      data-source-properties:
        # Segundos. Sin esto, una base congelada cuelga la consulta sin limite y no hay reintentos.
        socketTimeout: 3
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/messaging
  kafka:
    bootstrap-servers: kafka:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
