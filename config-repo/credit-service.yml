server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/credit
    username: credit
    password: ${CREDIT_DB_PASSWORD}
    hikari:
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/messaging
  kafka:
    bootstrap-servers: kafka:9092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      auto-offset-reset: earliest
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
